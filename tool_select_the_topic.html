<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thợ Săn Danh Từ - Bé Học Tiếng Việt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=Quicksand:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        @keyframes fall {
            from {
                transform: translateY(-100px);
            }

            to {
                transform: translateY(100vh);
            }
        }

        .falling-word {
            position: absolute;
            animation: fall linear forwards;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            user-select: none;
        }

        .falling-word:active {
            transform: scale(0.9);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }

        .game-bg {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .cloud {
            background: white;
            border-radius: 50px;
            padding: 15px 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 3px solid #4FC3F7;
            font-weight: bold;
            color: #0277BD;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }
    </style>
</head>

<body class="bg-blue-50">

    <div id="start-screen"
        class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-blue-400 text-white p-6 text-center">
        <h1 class="text-5xl font-bold mb-4">Thợ Săn Danh Từ! 🏹</h1>
        <p class="text-xl mb-8">Bé ơi, hãy nhấn vào các <b>Danh Từ</b> (tên gọi sự vật) đang rơi nhé!</p>
        <button onclick="startGame()"
            class="bg-yellow-400 hover:bg-yellow-300 text-blue-900 font-bold py-4 px-10 rounded-full text-2xl shadow-lg transition transform hover:scale-105">
            BẮT ĐẦU CHƠI
        </button>
    </div>

    <div id="game-container" class="game-bg hidden">
        <!-- Dashboard -->
        <div class="absolute top-4 left-4 right-4 flex justify-between items-center z-10">
            <div class="bg-white/80 p-3 rounded-2xl shadow-md border-2 border-blue-200">
                <span class="text-blue-600 font-bold text-xl">Điểm của bé: <span id="score">0</span></span>
            </div>
            <div class="bg-white/80 p-3 rounded-2xl shadow-md border-2 border-red-200">
                <span class="text-red-600 font-bold text-xl">Tim: <span id="lives">❤️❤️❤️</span></span>
            </div>
        </div>

        <!-- Game Area -->
        <div id="play-area" class="w-full h-full relative"></div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen"
        class="fixed inset-0 z-50 hidden flex flex-col items-center justify-center bg-black/80 text-white p-6 text-center">
        <h2 class="text-4xl font-bold mb-2">Hết giờ rồi!</h2>
        <p class="text-2xl mb-6">Bé đã săn được <span id="final-score" class="text-yellow-400 font-bold">0</span> danh
            từ!</p>
        <button onclick="location.reload()"
            class="bg-green-500 hover:bg-green-400 text-white font-bold py-3 px-8 rounded-full text-xl shadow-lg transition">
            CHƠI LẠI
        </button>
    </div>

    <!-- Audio Placeholders (Using visual feedback as substitute) -->
    <div id="feedback"
        class="fixed bottom-10 left-1/2 -translate-x-1/2 z-20 pointer-events-none opacity-0 transition-opacity duration-300">
        <div id="feedback-text" class="px-6 py-2 rounded-full text-white font-bold text-lg"></div>
    </div>

    <script>
        const playArea = document.getElementById('play-area');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameContainer = document.getElementById('game-container');
        const resultScreen = document.getElementById('result-screen');

        let score = 0;
        let lives = 3;
        let gameActive = false;
        let spawnInterval;

        // Danh sách từ vựng
        const nouns = ["Con mèo", "Cái bàn", "Ngôi nhà", "Bông hoa", "Mặt trời", "Cô giáo", "Quyển sách", "Quả táo", "Con voi", "Chiếc xe", "Ông nội", "Em bé"];
        const others = ["Chạy", "Nhảy", "Đẹp", "Nhanh", "Hát", "Xanh", "To", "Ngủ", "Đi", "Cười", "Vàng", "Khóc"];

        function startGame() {
            startScreen.classList.add('hidden');
            gameContainer.classList.remove('hidden');
            score = 0;
            lives = 3;
            gameActive = true;
            updateUI();

            // Bắt đầu tạo từ rơi
            spawnInterval = setInterval(spawnWord, 1500);
        }

        function spawnWord() {
            if (!gameActive) return;

            const isNoun = Math.random() > 0.4; // 60% tỉ lệ là danh từ
            const wordText = isNoun
                ? nouns[Math.floor(Math.random() * nouns.length)]
                : others[Math.floor(Math.random() * others.length)];

            const wordObj = document.createElement('div');
            wordObj.className = 'falling-word';
            wordObj.style.left = Math.random() * (window.innerWidth - 150) + 'px';

            // Tốc độ rơi ngẫu nhiên từ 4-7 giây
            const duration = 4 + Math.random() * 3;
            wordObj.style.animationDuration = duration + 's';

            wordObj.innerHTML = `<div class="cloud">${wordText}</div>`;

            // Xử lý khi nhấn vào từ
            wordObj.onclick = () => {
                if (!gameActive) return;
                handleChoice(wordObj, isNoun);
            };

            // Tự động xóa khi rơi hết màn hình
            wordObj.addEventListener('animationend', () => {
                if (wordObj.parentElement) {
                    if (isNoun && gameActive) {
                        // Nếu là danh từ mà bé bỏ lỡ, trừ tim
                        loseLife("Bé bỏ lỡ một danh từ rồi!");
                    }
                    wordObj.remove();
                }
            });

            playArea.appendChild(wordObj);
        }

        function handleChoice(element, isNoun) {
            if (isNoun) {
                score += 10;
                showFeedback("Đúng rồi! +10", "bg-green-500");
                element.style.transform = "scale(1.5)";
                element.style.opacity = "0";
                setTimeout(() => element.remove(), 200);
            } else {
                element.classList.add('shake');
                showFeedback("Ôi, đây không phải danh từ!", "bg-red-500");
                loseLife();
                setTimeout(() => element.classList.remove('shake'), 300);
            }
            updateUI();
        }

        function loseLife(msg) {
            lives--;
            if (msg) showFeedback(msg, "bg-orange-500");
            updateUI();
            if (lives <= 0) endGame();
        }

        function updateUI() {
            scoreEl.innerText = score;
            livesEl.innerText = "❤️".repeat(Math.max(0, lives));
        }

        function showFeedback(text, colorClass) {
            const fb = document.getElementById('feedback');
            const fbText = document.getElementById('feedback-text');
            fbText.innerText = text;
            fbText.className = `px-6 py-2 rounded-full text-white font-bold text-lg ${colorClass}`;
            fb.style.opacity = "1";
            setTimeout(() => fb.style.opacity = "0", 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            document.getElementById('final-score').innerText = score;
            resultScreen.classList.remove('hidden');
            // Xóa tất cả các từ đang rơi
            playArea.innerHTML = '';
        }
    </script>
</body>

</html>
